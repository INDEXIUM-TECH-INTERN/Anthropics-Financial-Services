# Render Blueprint — Free tier, 2 web services (backend + frontend) + Redis
# No credit card required (both services use plan: free, type: web)

services:
  # ===== Backend (Go API) =====
  - type: web
    name: testai-backend
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Gemini/Dockerfile
    dockerContext: ./Gemini
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
      - key: GEMINI_API_KEY_4
        sync: false
      - key: GEMINI_API_KEY_5
        sync: false

      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite

      - key: SERPAPI_KEY
        sync: false
      - key: SERPAPI_KEY_2
        sync: false

      - key: TAVILY_API_KEY
        sync: false
      - key: TAVILY_API_KEY_2
        sync: false

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: testai-redis
          property: connectionString

      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: ALLOWED_ORIGIN
        fromService:
          type: web
          name: testai-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # ===== Frontend (Nginx + SPA) — public entry point =====
  - type: web
    name: testai-frontend
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_PUBLIC_URL
        fromService:
          type: web
          name: testai-backend
          envVarKey: RENDER_EXTERNAL_URL

  # ===== Redis =====
  - type: keyvalue
    name: testai-redis
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

# Notes:
# 1. Share testai-frontend.onrender.com — frontend calls backend via BACKEND_PUBLIC_URL.
# 2. testai-backend also has a public URL on Free tier (API exposed directly).
# 3. Both Free web services sleep after ~15 min idle; first visit may take 30-60s.
# 4. For private backend (no public API URL), use type: pserv + plan: starter (~$7/mo, needs card).