# Render Blueprint for TestAIFinance — 100% Free tier (no credit card required)
# Single web service serves API + frontend SPA; Redis for cache/sessions

services:
  # ===== App (Go API + Frontend SPA) =====
  - type: web
    name: testai-app
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Gemini API keys (round-robin pool: GEMINI_API_KEY, GEMINI_API_KEY_2, ...)
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
      - key: GEMINI_API_KEY_4
        sync: false
      - key: GEMINI_API_KEY_5
        sync: false

      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite

      - key: SERPAPI_KEY
        sync: false
      - key: SERPAPI_KEY_2
        sync: false

      - key: TAVILY_API_KEY
        sync: false
      - key: TAVILY_API_KEY_2
        sync: false

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: testai-redis
          property: connectionString

      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

  # ===== Redis =====
  - type: keyvalue
    name: testai-redis
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

# Notes:
# 1. Manually set secret env vars in Render dashboard (sync: false).
# 2. Free web service sleeps after ~15 min idle; first request may take 30-60s to wake.
# 3. Local dev with separate frontend/backend: use docker-compose.yml instead.