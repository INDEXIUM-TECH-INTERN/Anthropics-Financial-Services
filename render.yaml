# Render Blueprint for TestAIFinance
# Multi-service deployment with Go backend + Frontend SPA

services:
  # ===== API Backend Service (Go) =====
  - type: web
    name: testai-backend
    env: docker
    region: singapore
    buildCommand: "cd Gemini && go mod download && CGO_ENABLED=0 GOOS=linux go build -ldflags='-s -w' -o /app/gemini-cli ./cmd/gemini-cli"
    startCommand: "./gemini-cli --server"
    envVars:
      # Gemini API Keys (5 keys in pool with round-robin)
      - key: GEMINI_API_KEYS
        sync: false
        generateValue: false

      # Gemini Model Configuration
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite

      # SerpAPI Keys (Web scraping - pool format)
      - key: SERPAPI_API_KEY
        sync: false
      - key: SERPAPI_API_KEY_2
        sync: false

      # Tavily Keys (Web search - pool format)
      - key: TAVILY_API_KEY
        sync: false
      - key: TAVILY_API_KEY_2
        sync: false

      
      # Redis Configuration
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: testai-redis
          property: connectionString

      # Application Settings
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: testai-redis
          property: connectionString
      - key: PORT
        value: 10000  # Render assigns random port, app uses 8080 internally
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
    healthCheck:
      path: /health
      interval: 30s
      timeout: 10s
      retries: 3
      startPeriod: 40s
    disk:
      sizeGB: 1
    instanceCount: 1
    cpuCount: 1
    memoryLimit: 1Gi
    dockerfilePath: ./Gemini/Dockerfile
    dockerContext: .
    public: false
    autoDeployTrigger: commit

  # ===== Redis Service =====
  - type: keyvalue
    name: testai-redis
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # ===== Frontend Service (Nginx) =====
  - type: web
    name: testai-frontend
    env: docker
    region: singapore
    buildCommand: "cd frontend && npm ci && npm run build"
    startCommand: "nginx -g 'daemon off;'"
    envVars:
      - key: NODE_ENV
        value: production
    healthCheck:
      path: /
      interval: 30s
      timeout: 10s
      retries: 3
    disk:
      sizeGB: 1
    instanceCount: 1
    cpuCount: 1
    memoryLimit: 512Mi
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    public: true
    routes:
      - type: rewrite
        source: //*
        destination: /index.html
    autoDeployTrigger: commit

# Database configuration (nếu cần thêm sau)
