<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Agent - Notebook Workspace</title>
    <!-- Import font Inter từ Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="workspace">
        <!-- Sidebar (Left) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>Financial Agent</h1>
            </div>
            
            <div class="sources-panel">
                <h3>Sources</h3>
                <div id="sources-list" class="sources-list">
                    <!-- Các nguồn trích dẫn sẽ hiển thị ở đây dưới dạng thẻ -->
                    <div class="empty-sources">Chưa có nguồn tham khảo nào.</div>
                </div>
            </div>

            <div class="metrics-panel">
                <h3>System Metrics</h3>
                <div class="metrics-grid">
                    <div class="metric-item">
                        <span>Latency</span>
                        <strong id="metric-latency">--</strong>
                    </div>
                    <div class="metric-item">
                        <span>RAM</span>
                        <strong id="metric-ram">--</strong>
                    </div>
                    <div class="metric-item">
                        <span>CPU</span>
                        <strong id="metric-cpu">--</strong>
                    </div>
                    <div class="metric-item">
                        <span>Tokens</span>
                        <strong id="metric-tokens">--</strong>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area (Right) -->
        <main class="chat-container">
            <div class="chat-history" id="chat-history">
                <!-- Welcome message -->
                <div class="message bot">
                    <div class="msg-content">Xin chào. Tôi là Financial Agent. Tôi có thể giúp bạn phân tích số liệu tài chính hoặc tìm kiếm thông tin thị trường.</div>
                </div>
            </div>
            
            <div class="chat-input-wrapper">
                <div class="input-box">
                    <textarea id="chat-input" placeholder="Hỏi về báo cáo tài chính, so sánh cổ phiếu..."></textarea>
                    <button id="send-btn" aria-label="Send">
                        <!-- Icon mũi tên lên SVG -->
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 4L12 20M12 4L6 10M12 4L18 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
