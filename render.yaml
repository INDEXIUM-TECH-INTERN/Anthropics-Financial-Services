services:
  - type: web
    name: indexium-gemini
    runtime: go
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    buildCommand: cd Gemini && go build -o gemini ./cmd/gemini-cli
    startCommand: cd Gemini && ./gemini -server
    healthCheckPath: /health
    buildFilter:
      paths:
        - Gemini/**
        - frontend/**
        - render.yaml
    envVars:
      - key: USE_OPENROUTER_ONLY
        value: "0"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: indexium-redis
          property: connectionString
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
      - key: GEMINI_API_KEY_4
        sync: false
      - key: GEMINI_API_KEY_5
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY_2
        sync: false
      - key: OPENROUTER_API_KEY_3
        sync: false
      - key: OPENROUTER_API_KEY_4
        sync: false
      - key: OPENROUTER_API_KEY_5
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false

  # Future backend:
